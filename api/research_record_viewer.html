<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved research evidence</title><style>body{margin:0;background:#07131f;color:#e1edf6;font:16px/1.5 system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:25px}h2{font-size:19px}table{width:100%;table-layout:fixed;border-collapse:collapse}td,th{padding:12px;text-align:left;vertical-align:top;border-bottom:1px solid #30475b;overflow-wrap:anywhere}a,summary{color:#79d6f6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c2031;padding:16px}summary{cursor:pointer}</style></head><body><main><h1 id="title"></h1><p id="scope"></p><p id="saved"></p><h2>Files and contents</h2><table><thead><tr><th>File</th><th>Contents</th></tr></thead><tbody id="files"></tbody></table><h2>Saved record</h2><pre id="record"></pre><details><summary>Runtime and limitations</summary><pre id="runtime"></pre><ul id="limits"></ul></details><p>Internal research evidence. Run the included verify.py against the ZIP to check file integrity.</p></main><script id="capture-data" type="application/json">__CAPTURE_JSON__</script><script>
const data=JSON.parse(document.getElementById('capture-data').textContent);
for(const [id,value] of Object.entries({title:data.title,scope:data.scope,saved:`Saved: ${data.stored_at_utc??'Not recorded'}`,record:JSON.stringify(data.record,null,2),runtime:JSON.stringify(data.runtime,null,2)}))document.getElementById(id).textContent=value;
for(const file of data.assets){const row=document.createElement('tr'),name=document.createElement('td'),description=document.createElement('td');if(file.availability==='available'){const link=document.createElement('a');link.href=file.path;link.textContent=file.path;name.append(link)}else name.textContent=file.path+' (unavailable)';description.textContent=file.description+(file.problem?' '+file.problem:'');row.append(name,description);document.getElementById('files').append(row)}
for(const text of data.limitations){const item=document.createElement('li');item.textContent=text;document.getElementById('limits').append(item)}
</script></body></html>
